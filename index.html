<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Trade OTC Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #151a24;
            --border-color: #232a37;
            --green: #089981;
            --green-glow: rgba(8, 153, 129, 0.4);
            --red: #f23645;
            --red-glow: rgba(242, 54, 69, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #787b86;
            --accent-cyan: #2962ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 15px;
            color: var(--accent-cyan);
        }

        .pair-dropdown { position: relative; }

        .selected-pair-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .flag-icon { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; }

        .dropdown-menu {
            position: absolute;
            top: 110%;
            left: 0;
            width: 210px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .dropdown-menu.active { display: flex; }

        .pair-option {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .pair-option:hover { background: rgba(255, 255, 255, 0.06); }

        .demo-balance-box {
            background: rgba(8, 153, 129, 0.12);
            border: 1px solid rgba(8, 153, 129, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            text-align: right;
        }

        .balance-label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .balance-amount { font-size: 13px; font-weight: 800; color: var(--green); }

        .demo-text-desktop { display: inline; }
        .demo-text-mobile { display: none; }

        @media (max-width: 600px) {
            .demo-text-desktop { display: none; }
            .demo-text-mobile { display: inline; }
            .control-panel { width: 100% !important; height: 180px; flex-direction: row !important; }
            .workspace { flex-direction: column; }
        }

        /* --- WORKSPACE --- */
        .workspace { display: flex; flex: 1; position: relative; overflow: hidden; }

        .chart-area {
            flex: 1;
            position: relative;
            background: var(--bg-dark);
            cursor: crosshair;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Timeframe Selector */
        .timeframe-toolbar {
            position: absolute;
            left: 15px;
            top: 15px;
            background: rgba(21, 26, 36, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            gap: 2px;
            padding: 3px;
            z-index: 5;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .tf-btn.active { background: var(--accent-cyan); color: #fff; }

        /* RIGHT PANEL */
        .control-panel {
            width: 260px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .input-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            outline: none;
            text-align: center;
        }

        .btn-trade {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.1s;
        }

        .btn-trade:active { transform: scale(0.97); }
        .btn-up { background: var(--green); box-shadow: 0 4px 12px var(--green-glow); }
        .btn-down { background: var(--red); box-shadow: 0 4px 12px var(--red-glow); }

        .trades-log {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trade-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-cyan);
        }

        /* Quotex Result Modal */
        .result-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(21, 26, 36, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 99;
            animation: slideIn 0.3s forwards;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-chart-line"></i> QUANTUM OTC
        </div>

        <div class="pair-dropdown">
            <div class="selected-pair-btn" onclick="togglePairDropdown()">
                <img src="https://flagcdn.com/w40/pk.png" id="selectedFlag" class="flag-icon">
                <span id="selectedPairText" style="font-weight: 700; font-size: 12px;">USD/PKR (OTC)</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 9px; color: var(--text-muted);"></i>
            </div>

            <div class="dropdown-menu" id="pairMenu">
                <div class="pair-option" onclick="selectPair('USD/PKR (OTC)', 'https://flagcdn.com/w40/pk.png')">
                    <span><img src="https://flagcdn.com/w40/pk.png" class="flag-icon"> USD/PKR (OTC)</span>
                    <span style="color:var(--green)">92%</span>
                </div>
                <div class="pair-option" onclick="selectPair('USD/INR (OTC)', 'https://flagcdn.com/w40/in.png')">
                    <span><img src="https://flagcdn.com/w40/in.png" class="flag-icon"> USD/INR (OTC)</span>
                    <span style="color:var(--green)">90%</span>
                </div>
                <div class="pair-option" onclick="selectPair('USD/BDT (OTC)', 'https://flagcdn.com/w40/bd.png')">
                    <span><img src="https://flagcdn.com/w40/bd.png" class="flag-icon"> USD/BDT (OTC)</span>
                    <span style="color:var(--green)">88%</span>
                </div>
                <div class="pair-option" onclick="selectPair('USD/BRL (OTC)', 'https://flagcdn.com/w40/br.png')">
                    <span><img src="https://flagcdn.com/w40/br.png" class="flag-icon"> USD/BRL (OTC)</span>
                    <span style="color:var(--green)">85%</span>
                </div>
                <div class="pair-option" onclick="selectPair('USD/ARS (OTC)', 'https://flagcdn.com/w40/ar.png')">
                    <span><img src="https://flagcdn.com/w40/ar.png" class="flag-icon"> USD/ARS (OTC)</span>
                    <span style="color:var(--green)">87%</span>
                </div>
            </div>
        </div>

        <div class="demo-balance-box">
            <div class="balance-label"><span class="demo-text-desktop">Demo Account</span><span class="demo-text-mobile">Demo</span></div>
            <div class="balance-amount" id="demoBalance">$10,000.00</div>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <div class="chart-area" id="chartContainer">
            <canvas id="tradingCanvas"></canvas>

            <div class="timeframe-toolbar">
                <button class="tf-btn" onclick="setCandleTimeframe(10, this)">10s</button>
                <button class="tf-btn active" onclick="setCandleTimeframe(30, this)">30s</button>
                <button class="tf-btn" onclick="setCandleTimeframe(60, this)">1m</button>
            </div>

            <!-- Result Overlay -->
            <div class="result-overlay" id="resultOverlay">
                <i class="fa-solid fa-trophy" id="resIcon" style="font-size: 24px;"></i>
                <div>
                    <div id="resTitle" style="font-weight: 800; font-size: 14px;">WIN +$90.00</div>
                    <div id="resSub" style="font-size: 11px; color: var(--text-muted);">Trade Result</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="control-panel">
            <div class="control-group">
                <div class="control-label">Trade Time</div>
                <div class="input-box">
                    <i class="fa-regular fa-clock" style="color: var(--text-muted);"></i>
                    <input type="text" id="tradeDurationInput" value="00:30">
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">Investment ($)</div>
                <div class="input-box">
                    <input type="number" id="tradeAmount" value="50" min="1">
                </div>
            </div>

            <button class="btn-trade btn-up" onclick="executeTrade('UP')">
                <span><i class="fa-solid fa-arrow-trend-up"></i> HIGHER</span>
                <span>92%</span>
            </button>

            <button class="btn-trade btn-down" onclick="executeTrade('DOWN')">
                <span><i class="fa-solid fa-arrow-trend-down"></i> LOWER</span>
                <span>92%</span>
            </button>

            <div class="control-label">Active / Closed Trades</div>
            <div class="trades-log" id="tradesLog"></div>
        </div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('qt_demo_balance')) || 10000.00;
        let currentPair = "USD/PKR (OTC)";
        let candleTimeframe = 30; 
        let candles = [];
        let activeTrades = [];

        // Smooth Canvas Interaction Variables
        const canvas = document.getElementById('tradingCanvas');
        const ctx = canvas.getContext('2d');
        let zoomLevel = 1.0;
        let panXOffset = 0;
        let isDragging = false;
        let startDragX = 0;

        const basePrices = {
            "USD/PKR (OTC)": 278.50,
            "USD/INR (OTC)": 83.40,
            "USD/BDT (OTC)": 117.20,
            "USD/BRL (OTC)": 5.45,
            "USD/ARS (OTC)": 920.10
        };

        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('DOMContentLoaded', () => {
            updateBalanceUI();
            resizeCanvas();
            initCandles();
            setupEventListeners();
            connectRealtimeStream();
            requestAnimationFrame(renderSmoothChart);
        });

        function updateBalanceUI() {
            document.getElementById('demoBalance').innerText = `$${balance.toFixed(2)}`;
            localStorage.setItem('qt_demo_balance', balance);
        }

        function resizeCanvas() {
            const container = document.getElementById('chartContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function togglePairDropdown() {
            document.getElementById('pairMenu').classList.toggle('active');
        }

        function selectPair(pairName, flagUrl) {
            currentPair = pairName;
            document.getElementById('selectedPairText').innerText = pairName;
            document.getElementById('selectedFlag').src = flagUrl;
            document.getElementById('pairMenu').classList.remove('active');
            initCandles();
        }

        function setCandleTimeframe(sec, btn) {
            candleTimeframe = sec;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initCandles();
        }

        function initCandles() {
            candles = [];
            let price = basePrices[currentPair] || 100.00;
            const now = Math.floor(Date.now() / 1000);

            for (let i = 60; i >= 0; i--) {
                let open = price;
                let close = open + (Math.random() - 0.498) * (price * 0.0012);
                let high = Math.max(open, close) + Math.random() * (price * 0.0005);
                let low = Math.min(open, close) - Math.random() * (price * 0.0005);

                candles.push({
                    time: now - (i * candleTimeframe),
                    open: open, high: high, low: low, close: close
                });
                price = close;
            }
        }

        // --- REALTIME WEBSOCKET STREAMING ---
        function connectRealtimeStream() {
            // Emulating high-frequency WebSocket Tick (100ms)
            setInterval(async () => {
                try {
                    const res = await fetch(`/api/c.js?pair=${encodeURIComponent(currentPair)}`);
                    const data = await res.json();
                    if (data && data.price) {
                        updateLiveTick(data.price);
                    }
                } catch (e) {
                    const last = candles[candles.length - 1];
                    let mock = last.close + (Math.random() - 0.495) * (last.close * 0.0006);
                    updateLiveTick(mock);
                }
                checkTradesExpiration();
            }, 100);
        }

        function updateLiveTick(price) {
            if (candles.length === 0) return;
            let current = candles[candles.length - 1];
            let now = Math.floor(Date.now() / 1000);

            if (now - current.time >= candleTimeframe) {
                candles.push({ time: now, open: current.close, high: price, low: price, close: price });
                if (candles.length > 100) candles.shift();
            } else {
                current.close = price;
                current.high = Math.max(current.high, price);
                current.low = Math.min(current.low, price);
            }
        }

        // --- MOUSE, TRACKPAD & TOUCH CONTROLS ---
        function setupEventListeners() {
            // Mouse Wheel Zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomLevel = Math.min(zoomLevel + 0.08, 2.8);
                } else {
                    zoomLevel = Math.max(zoomLevel - 0.08, 0.4);
                }
            }, { passive: false });

            // Drag Start (Mouse & Touch)
            const startDrag = (x) => {
                isDragging = true;
                startDragX = x - panXOffset;
            };

            const moveDrag = (x) => {
                if (!isDragging) return;
                panXOffset = x - startDragX;
            };

            const endDrag = () => { isDragging = false; };

            canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
            window.addEventListener('mouseup', endDrag);

            canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX));
            window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX));
            window.addEventListener('touchend', endDrag);
        }

        // --- RENDER ENGINE ---
        function renderSmoothChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (candles.length === 0) {
                requestAnimationFrame(renderSmoothChart);
                return;
            }

            const candleWidth = 10 * zoomLevel;
            const candleGap = 5 * zoomLevel;
            const step = candleWidth + candleGap;

            let minPrice = Infinity, maxPrice = -Infinity;
            candles.forEach(c => {
                if (c.low < minPrice) minPrice = c.low;
                if (c.high > maxPrice) maxPrice = c.high;
            });

            const pad = (maxPrice - minPrice) * 0.12 || 1;
            minPrice -= pad; maxPrice += pad;

            const getY = (p) => canvas.height - ((p - minPrice) / (maxPrice - minPrice)) * (canvas.height - 70) - 35;

            // Grid Lines
            ctx.strokeStyle = 'rgba(35, 42, 55, 0.5)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 6; i++) {
                let y = (canvas.height / 6) * i;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Candles
            let startX = canvas.width - 100 + panXOffset;

            for (let i = candles.length - 1; i >= 0; i--) {
                let c = candles[i];
                let x = startX - (candles.length - 1 - i) * step;

                if (x < -20 || x > canvas.width + 20) continue;

                let isUp = c.close >= c.open;
                ctx.strokeStyle = isUp ? '#089981' : '#f23645';
                ctx.fillStyle = isUp ? '#089981' : '#f23645';

                // Wick
                ctx.beginPath();
                ctx.moveTo(x, getY(c.high));
                ctx.lineTo(x, getY(c.low));
                ctx.stroke();

                // Body
                let openY = getY(c.open), closeY = getY(c.close);
                let bodyH = Math.max(Math.abs(closeY - openY), 2);
                ctx.fillRect(x - candleWidth / 2, Math.min(openY, closeY), candleWidth, bodyH);
            }

            // Draw Active Trade Indicators on Chart
            activeTrades.forEach(t => {
                let tradeY = getY(t.entryPrice);
                ctx.setLineDash([3, 3]);
                ctx.strokeStyle = t.type === 'UP' ? '#089981' : '#f23645';
                ctx.beginPath(); ctx.moveTo(0, tradeY); ctx.lineTo(canvas.width, tradeY); ctx.stroke();
                ctx.setLineDash([]);

                // Trade Icon Tag
                ctx.fillStyle = t.type === 'UP' ? '#089981' : '#f23645';
                ctx.fillRect(20, tradeY - 10, 50, 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Inter';
                ctx.fillText(`${t.type} $${t.amount}`, 24, tradeY + 4);
            });

            // Live Price Line & Candle Countdown
            let last = candles[candles.length - 1];
            let liveY = getY(last.close);

            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#2962ff';
            ctx.beginPath(); ctx.moveTo(0, liveY); ctx.lineTo(canvas.width, liveY); ctx.stroke();
            ctx.setLineDash([]);

            // Countdown Timer calculation
            let now = Math.floor(Date.now() / 1000);
            let secondsLeft = candleTimeframe - (now - last.time);
            if (secondsLeft < 0) secondsLeft = 0;
            let timerStr = `00:${secondsLeft < 10 ? '0' + secondsLeft : secondsLeft}`;

            // Price & Timer Box
            ctx.fillStyle = '#2962ff';
            ctx.fillRect(canvas.width - 90, liveY - 12, 90, 24);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px Inter';
            ctx.fillText(`${last.close.toFixed(2)} | ${timerStr}`, canvas.width - 86, liveY + 4);

            requestAnimationFrame(renderSmoothChart);
        }

        // --- TRADING SYSTEM ---
        function executeTrade(type) {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            if (isNaN(amount) || amount <= 0 || amount > balance) return;

            balance -= amount;
            updateBalanceUI();

            const durationSec = 30; // 30 sec default trade time
            const entryPrice = candles[candles.length - 1].close;

            const trade = {
                id: Date.now(),
                pair: currentPair,
                type: type,
                amount: amount,
                entryPrice: entryPrice,
                expireTime: Date.now() + (durationSec * 1000)
            };

            activeTrades.push(trade);
            updateTradeLogUI(trade, 'RUNNING');
        }

        function checkTradesExpiration() {
            const now = Date.now();
            const currentPrice = candles[candles.length - 1].close;

            for (let i = activeTrades.length - 1; i >= 0; i--) {
                let t = activeTrades[i];
                if (now >= t.expireTime) {
                    let win = false;
                    if (t.type === 'UP' && currentPrice > t.entryPrice) win = true;
                    if (t.type === 'DOWN' && currentPrice < t.entryPrice) win = true;

                    if (win) {
                        let profit = t.amount * 1.92;
                        balance += profit;
                        updateBalanceUI();
                        showQuotexResult('WIN', profit);
                        updateTradeLogUI(t, 'WIN', profit);
                    } else {
                        showQuotexResult('LOSS', t.amount);
                        updateTradeLogUI(t, 'LOSS', 0);
                    }
                    activeTrades.splice(i, 1);
                }
            }
        }

        function showQuotexResult(type, amt) {
            const overlay = document.getElementById('resultOverlay');
            const icon = document.getElementById('resIcon');
            const title = document.getElementById('resTitle');

            if (type === 'WIN') {
                overlay.style.borderColor = "var(--green)";
                icon.style.color = "var(--green)";
                title.style.color = "var(--green)";
                title.innerText = `WIN +$${amt.toFixed(2)}`;
            } else {
                overlay.style.borderColor = "var(--red)";
                icon.style.color = "var(--red)";
                title.style.color = "var(--red)";
                title.innerText = `LOSS -$${amt.toFixed(2)}`;
            }

            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 2500);
        }

        function updateTradeLogUI(trade, status, payout = 0) {
            const container = document.getElementById('tradesLog');
            let el = document.getElementById(`trd-${trade.id}`);

            if (!el) {
                el = document.createElement('div');
                el.id = `trd-${trade.id}`;
                container.prepend(el);
            }

            if (status === 'RUNNING') {
                el.className = 'trade-card';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <i class="fa-solid fa-spinner fa-spin" style="color:var(--accent-cyan)"></i>`;
            } else if (status === 'WIN') {
                el.className = 'trade-card';
                el.style.borderLeftColor = 'var(--green)';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <span style="color:var(--green)">+$${payout.toFixed(2)}</span>`;
            } else {
                el.className = 'trade-card';
                el.style.borderLeftColor = 'var(--red)';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <span style="color:var(--red)">-$${trade.amount.toFixed(2)}</span>`;
            }
        }
    </script>
</body>
</html>
