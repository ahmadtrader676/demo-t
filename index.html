<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Trade OTC Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #151a24;
            --border-color: #232a37;
            --green: #089981;
            --green-glow: rgba(8, 153, 129, 0.4);
            --red: #f23645;
            --red-glow: rgba(242, 54, 69, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #787b86;
            --accent-cyan: #2962ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            touch-action: none; /* Mobile par default page scroll block karke smooth pinch zoom ke liye */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 15px;
            color: var(--accent-cyan);
        }

        .pair-dropdown { position: relative; }

        .selected-pair-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .flag-icon { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; }

        .dropdown-menu {
            position: absolute;
            top: 110%;
            left: 0;
            width: 210px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .dropdown-menu.active { display: flex; }

        .pair-option {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .pair-option:hover { background: rgba(255, 255, 255, 0.06); }

        .demo-balance-box {
            background: rgba(8, 153, 129, 0.12);
            border: 1px solid rgba(8, 153, 129, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            text-align: right;
        }

        .balance-label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .balance-amount { font-size: 13px; font-weight: 800; color: var(--green); }

        .workspace { display: flex; flex: 1; position: relative; overflow: hidden; }

        .chart-area {
            flex: 1;
            position: relative;
            background: var(--bg-dark);
            cursor: crosshair;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .timeframe-toolbar {
            position: absolute;
            left: 15px;
            top: 15px;
            background: rgba(21, 26, 36, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            gap: 2px;
            padding: 3px;
            z-index: 5;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .tf-btn.active { background: var(--accent-cyan); color: #fff; }

        .control-panel {
            width: 260px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .input-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            outline: none;
            text-align: center;
        }

        .btn-trade {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-up { background: var(--green); box-shadow: 0 4px 12px var(--green-glow); }
        .btn-down { background: var(--red); box-shadow: 0 4px 12px var(--red-glow); }

        .trades-log {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trade-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-cyan);
        }

        @media (max-width: 600px) {
            .workspace { flex-direction: column; }
            .control-panel { width: 100% !important; height: 210px; flex-direction: row !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-chart-line"></i> QUANTUM OTC
        </div>

        <div class="pair-dropdown">
            <div class="selected-pair-btn" onclick="togglePairDropdown()">
                <img src="https://flagcdn.com/w40/pk.png" id="selectedFlag" class="flag-icon">
                <span id="selectedPairText" style="font-weight: 700; font-size: 12px;">USD/PKR (OTC)</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 9px; color: var(--text-muted);"></i>
            </div>

            <div class="dropdown-menu" id="pairMenu">
                <div class="pair-option" onclick="selectPair('USD/PKR (OTC)', 'https://flagcdn.com/w40/pk.png')">
                    <span><img src="https://flagcdn.com/w40/pk.png" class="flag-icon"> USD/PKR (OTC)</span>
                    <span style="color:var(--green)">92%</span>
                </div>
                <div class="pair-option" onclick="selectPair('USD/INR (OTC)', 'https://flagcdn.com/w40/in.png')">
                    <span><img src="https://flagcdn.com/w40/in.png" class="flag-icon"> USD/INR (OTC)</span>
                    <span style="color:var(--green)">90%</span>
                </div>
            </div>
        </div>

        <div class="demo-balance-box">
            <div class="balance-label">Demo</div>
            <div class="balance-amount" id="demoBalance">$10,000.00</div>
        </div>
    </header>

    <div class="workspace">
        <div class="chart-area" id="chartContainer">
            <canvas id="tradingCanvas"></canvas>

            <div class="timeframe-toolbar">
                <button class="tf-btn" onclick="setCandleTimeframe(10, this)">10s</button>
                <button class="tf-btn active" onclick="setCandleTimeframe(30, this)">30s</button>
                <button class="tf-btn" onclick="setCandleTimeframe(60, this)">1m</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <div class="control-label">Time (s)</div>
                <div class="input-box">
                    <input type="number" id="tradeDurationInput" value="30">
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">Amount ($)</div>
                <div class="input-box">
                    <input type="number" id="tradeAmount" value="50" min="1">
                </div>
            </div>

            <button class="btn-trade btn-up" onclick="executeTrade('UP')">
                <span>HIGHER</span>
                <span>92%</span>
            </button>

            <button class="btn-trade btn-down" onclick="executeTrade('DOWN')">
                <span>LOWER</span>
                <span>92%</span>
            </button>

            <div class="trades-log" id="tradesLog"></div>
        </div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('qt_demo_balance')) || 10000.00;
        let currentPair = "USD/PKR (OTC)";
        let candleTimeframe = 30; 
        let candles = [];
        let activeTrades = [];

        const canvas = document.getElementById('tradingCanvas');
        const ctx = canvas.getContext('2d');
        
        let zoomLevel = 1.0;
        let panXOffset = 0;
        let isDragging = false;
        let startDragX = 0;

        // Mobile Pinch Zoom Variables
        let initialPinchDistance = null;
        let initialZoom = 1.0;

        const basePrices = {
            "USD/PKR (OTC)": 278.5000,
            "USD/INR (OTC)": 83.4000
        };

        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('DOMContentLoaded', () => {
            updateBalanceUI();
            resizeCanvas();
            initCandles();
            setupTouchAndMouseEvents();
            initWebSocketStream(); // Fast non-blocking socket stream
            requestAnimationFrame(renderSmoothChart);
        });

        function updateBalanceUI() {
            document.getElementById('demoBalance').innerText = `$${balance.toFixed(2)}`;
            localStorage.setItem('qt_demo_balance', balance);
        }

        function resizeCanvas() {
            const container = document.getElementById('chartContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function togglePairDropdown() {
            document.getElementById('pairMenu').classList.toggle('active');
        }

        function selectPair(pairName, flagUrl) {
            currentPair = pairName;
            document.getElementById('selectedPairText').innerText = pairName;
            document.getElementById('selectedFlag').src = flagUrl;
            document.getElementById('pairMenu').classList.remove('active');
            initCandles();
        }

        function setCandleTimeframe(sec, btn) {
            candleTimeframe = sec;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initCandles();
        }

        function initCandles() {
            candles = [];
            let price = basePrices[currentPair] || 100.00;
            const now = Math.floor(Date.now() / 1000);

            for (let i = 50; i >= 0; i--) {
                candles.push({
                    time: now - (i * candleTimeframe),
                    open: price, high: price, low: price, close: price
                });
            }
        }

        // --- Stream / Data Handling (No Page Freeze) ---
        function initWebSocketStream() {
            // Har 100ms par tick smooth handle bina network HTTP block/freeze ke
            setInterval(() => {
                if (candles.length === 0) return;
                
                // Fast internal ticker stream
                let current = candles[candles.length - 1];
                let livePrice = current.close;

                updateLiveTick(livePrice);
                checkTradesExpiration();
            }, 100);
        }

        function updateLiveTick(price) {
            let current = candles[candles.length - 1];
            let now = Math.floor(Date.now() / 1000);

            if (now - current.time >= candleTimeframe) {
                candles.push({ time: now, open: current.close, high: price, low: price, close: price });
                if (candles.length > 80) candles.shift();
            } else {
                current.close = price;
                current.high = Math.max(current.high, price);
                current.low = Math.min(current.low, price);
            }
        }

        // --- Touch Zoom (Pinch-to-zoom) & Pan Control Fix ---
        function setupTouchAndMouseEvents() {
            // Mouse Wheel Zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                zoomLevel = e.deltaY < 0 ? Math.min(zoomLevel + 0.08, 3.0) : Math.max(zoomLevel - 0.08, 0.4);
            }, { passive: false });

            // Mouse Dragging
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                startDragX = e.clientX - panXOffset;
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) panXOffset = e.clientX - startDragX;
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Touch Gestures (Mobile Finger Zoom + Drag)
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startDragX = e.touches[0].clientX - panXOffset;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialZoom = zoomLevel;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    panXOffset = e.touches[0].clientX - startDragX;
                } else if (e.touches.length === 2 && initialPinchDistance) {
                    const currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const zoomFactor = currentDistance / initialPinchDistance;
                    zoomLevel = Math.min(Math.max(initialZoom * zoomFactor, 0.4), 3.0);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) initialPinchDistance = null;
                if (e.touches.length === 0) isDragging = false;
            });
        }

        // --- Canvas Rendering Loop ---
        function renderSmoothChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (candles.length === 0) {
                requestAnimationFrame(renderSmoothChart);
                return;
            }

            const candleWidth = 12 * zoomLevel;
            const candleGap = 6 * zoomLevel;
            const step = candleWidth + candleGap;

            let minPrice = Infinity, maxPrice = -Infinity;
            candles.forEach(c => {
                if (c.low < minPrice) minPrice = c.low;
                if (c.high > maxPrice) maxPrice = c.high;
            });

            const pad = (maxPrice - minPrice) * 0.15 || 0.5;
            minPrice -= pad; maxPrice += pad;

            const getY = (p) => canvas.height - ((p - minPrice) / (maxPrice - minPrice)) * (canvas.height - 80) - 40;

            // Grid lines
            ctx.strokeStyle = 'rgba(35, 42, 55, 0.5)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 6; i++) {
                let y = (canvas.height / 6) * i;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            let startX = canvas.width - 110 + panXOffset;

            for (let i = candles.length - 1; i >= 0; i--) {
                let c = candles[i];
                let x = startX - (candles.length - 1 - i) * step;

                if (x < -20 || x > canvas.width + 20) continue;

                let isUp = c.close >= c.open;
                ctx.strokeStyle = isUp ? '#089981' : '#f23645';
                ctx.fillStyle = isUp ? '#089981' : '#f23645';

                ctx.beginPath();
                ctx.moveTo(x, getY(c.high));
                ctx.lineTo(x, getY(c.low));
                ctx.stroke();

                let openY = getY(c.open), closeY = getY(c.close);
                let bodyH = Math.max(Math.abs(closeY - openY), 2);
                ctx.fillRect(x - candleWidth / 2, Math.min(openY, closeY), candleWidth, bodyH);
            }

            // Live Price Line & Countdown
            let last = candles[candles.length - 1];
            let liveY = getY(last.close);

            ctx.setLineDash([3, 3]);
            ctx.strokeStyle = '#2962ff';
            ctx.beginPath(); ctx.moveTo(0, liveY); ctx.lineTo(canvas.width, liveY); ctx.stroke();
            ctx.setLineDash([]);

            let now = Math.floor(Date.now() / 1000);
            let secondsLeft = candleTimeframe - (now - last.time);
            if (secondsLeft < 0) secondsLeft = 0;
            let timerStr = `00:${secondsLeft < 10 ? '0' + secondsLeft : secondsLeft}`;

            ctx.fillStyle = '#2962ff';
            ctx.fillRect(canvas.width - 100, liveY - 12, 100, 24);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px Inter';
            ctx.fillText(`${last.close.toFixed(4)} | ${timerStr}`, canvas.width - 96, liveY + 4);

            requestAnimationFrame(renderSmoothChart);
        }

        function executeTrade(type) {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            const durationSec = parseInt(document.getElementById('tradeDurationInput').value) || 30;

            if (isNaN(amount) || amount <= 0 || amount > balance) return;

            balance -= amount;
            updateBalanceUI();

            const entryPrice = candles[candles.length - 1].close;

            const trade = {
                id: Date.now(),
                pair: currentPair,
                type: type,
                amount: amount,
                entryPrice: entryPrice,
                expireTime: Date.now() + (durationSec * 1000)
            };

            activeTrades.push(trade);
            updateTradeLogUI(trade, 'RUNNING');
        }

        function checkTradesExpiration() {
            const now = Date.now();
            const currentPrice = candles[candles.length - 1].close;

            for (let i = activeTrades.length - 1; i >= 0; i--) {
                let t = activeTrades[i];
                if (now >= t.expireTime) {
                    let win = false;
                    if (t.type === 'UP' && currentPrice > t.entryPrice) win = true;
                    if (t.type === 'DOWN' && currentPrice < t.entryPrice) win = true;

                    if (win) {
                        let profit = t.amount * 1.92;
                        balance += profit;
                        updateBalanceUI();
                        updateTradeLogUI(t, 'WIN', profit);
                    } else {
                        updateTradeLogUI(t, 'LOSS', 0);
                    }
                    activeTrades.splice(i, 1);
                }
            }
        }

        function updateTradeLogUI(trade, status, payout = 0) {
            const container = document.getElementById('tradesLog');
            let el = document.getElementById(`trd-${trade.id}`);

            if (!el) {
                el = document.createElement('div');
                el.id = `trd-${trade.id}`;
                container.prepend(el);
            }

            if (status === 'RUNNING') {
                el.className = 'trade-card';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <i class="fa-solid fa-spinner fa-spin" style="color:var(--accent-cyan)"></i>`;
            } else if (status === 'WIN') {
                el.className = 'trade-card';
                el.style.borderLeftColor = 'var(--green)';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <span style="color:var(--green)">+$${payout.toFixed(2)}</span>`;
            } else {
                el.className = 'trade-card';
                el.style.borderLeftColor = 'var(--red)';
                el.innerHTML = `<span><strong>${trade.type}</strong> $${trade.amount}</span> <span style="color:var(--red)">-$${trade.amount.toFixed(2)}</span>`;
            }
        }
    </script>
</body>
</html>
