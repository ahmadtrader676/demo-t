<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Trade - Master Admin Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #151a24;
            --border: #232a37;
            --green: #089981;
            --red: #f23645;
            --blue: #2962ff;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text);
            padding: 25px 15px;
            display: flex;
            justify-content: center;
        }

        .admin-card {
            width: 100%;
            max-width: 850px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .pair-row {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pair-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
        }

        .controls-grid {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-action {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            color: #fff;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .btn-action.active { opacity: 1; transform: scale(1.05); }
        .btn-up { background: var(--green); }
        .btn-neutral { background: #475569; }
        .btn-down { background: var(--red); }

        .price-input-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .price-input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 700;
            width: 90px;
            outline: none;
        }

        .btn-set {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .status-bar {
            text-align: center;
            font-size: 12px;
            color: var(--blue);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header">
            <h2 style="color:var(--blue); font-size: 18px;"><i class="fa-solid fa-sliders"></i> Admin Market Manipulator</h2>
            <span style="font-size: 11px; color: #787b86;">Firebase Connected</span>
        </div>

        <div id="controlsList"></div>

        <div class="status-bar" id="syncStatus">
            <i class="fa-solid fa-signal"></i> System Ready
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reactions-maker-site-default-rtdb.firebaseio.com/pr.json";

        const pairs = [
            { name: "USD/PKR (OTC)", key: "USD_PKR_OTC" },
            { name: "USD/INR (OTC)", key: "USD_INR_OTC" },
            { name: "USD/BDT (OTC)", key: "USD_BDT_OTC" }
        ];

        let controlData = {};

        window.addEventListener('DOMContentLoaded', async () => {
            await loadFirebaseData();
            renderAdminPanel();
        });

        async function loadFirebaseData() {
            try {
                const res = await fetch(FIREBASE_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.controls) {
                        controlData = data.controls;
                    }
                }
            } catch (e) {
                console.error("Firebase fetch error");
            }
        }

        function renderAdminPanel() {
            const list = document.getElementById('controlsList');
            list.innerHTML = "";

            pairs.forEach(p => {
                const item = controlData[p.key] || { mode: "NEUTRAL", customPrice: "" };

                const row = document.createElement('div');
                row.className = "pair-row";
                row.innerHTML = `
                    <div class="pair-header">
                        <span>${p.name}</span>
                        <span style="font-size:11px; color:var(--blue);">Key: ${p.key}</span>
                    </div>
                    <div class="controls-grid">
                        <button class="btn-action btn-up ${item.mode === 'FORCE_UP' ? 'active' : ''}" onclick="setMode('${p.key}', 'FORCE_UP')">
                            <i class="fa-solid fa-arrow-up"></i> FORCE GREEN
                        </button>
                        <button class="btn-action btn-neutral ${item.mode === 'NEUTRAL' ? 'active' : ''}" onclick="setMode('${p.key}', 'NEUTRAL')">
                            <i class="fa-solid fa-pause"></i> FREEZE / STUCK
                        </button>
                        <button class="btn-action btn-down ${item.mode === 'FORCE_DOWN' ? 'active' : ''}" onclick="setMode('${p.key}', 'FORCE_DOWN')">
                            <i class="fa-solid fa-arrow-down"></i> FORCE RED
                        </button>

                        <div class="price-input-box">
                            <span style="font-size:10px; color:#787b86;">PRICE:</span>
                            <input type="number" step="0.0001" id="p-${p.key}" value="${item.customPrice || ''}" placeholder="Set Exact">
                            <button class="btn-set" onclick="setCustomPrice('${p.key}')">SET</button>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        async function setMode(key, mode) {
            if (!controlData[key]) controlData[key] = {};
            controlData[key].mode = mode;
            controlData[key].customPrice = null; // Clear manual price on mode switch

            await pushToFirebase();
            renderAdminPanel();
        }

        async function setCustomPrice(key) {
            const val = document.getElementById(`p-${key}`).value;
            if (!val) return;

            if (!controlData[key]) controlData[key] = {};
            controlData[key].customPrice = parseFloat(val);
            controlData[key].mode = "MANUAL";

            await pushToFirebase();
            renderAdminPanel();
        }

        async function pushToFirebase() {
            document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

            try {
                const res = await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ controls: controlData })
                });

                if (res.ok) {
                    document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Data Live Updated Successfully!`;
                } else {
                    const err = await res.json();
                    document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:var(--red)"></i> ${err.error || 'Update Failed'}`;
                }
            } catch (e) {
                document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:var(--red)"></i> Connection Error!`;
            }
        }
    </script>
</body>
</html>
